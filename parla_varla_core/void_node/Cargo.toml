[package]
name = "void_node"
version = "0.1.0"
edition = "2021"
authors = ["Parla Autonomous Engineering Team"]
description = "Zero-Trust Fail-Closed Cryptographic Bridge and Merkle Proof Engine for Dual-Personality OSINT System"

[dependencies]
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tonic = "0.10"
prost = "0.12"

[build-dependencies]
tonic-build = "0.10"
